name: CI - Lint e Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Rodar ESLint
        run: npm run lint
        continue-on-error: true

      - name: Iniciar servidor em background
        run: |
          npm start &
          echo "Aguardando servidor subir..."
          sleep 15
          curl -s http://localhost:3000/health || echo "Servidor nao respondeu ainda"
        env:
          NODE_ENV: test
          SKIP_RATE_LIMIT: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Rodar testes
        run: npm test
        env:
          NODE_ENV: test
          SKIP_RATE_LIMIT: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Parar servidor
        if: always()
        run: pkill -f "node src/server.js" || true